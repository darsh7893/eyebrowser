name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Optional: sign the release bundle with the real upload key.
      # Set repo secrets ANDROID_KEYSTORE_BASE64 (+ KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD). When absent, the step is a no-op and the
      # release bundle falls back to debug signing so the build never fails.
      - name: Decode keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/eyebrowser.keystore
            {
              echo "KEYSTORE_PATH=/tmp/eyebrowser.keystore"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No keystore secret — release will use debug signing."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (Play upload)
        run: gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-aab
          path: app/build/outputs/bundle/release/app-release.aab
