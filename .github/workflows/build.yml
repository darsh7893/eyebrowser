name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Optional: sign the release bundle with the real upload key.
      # Set repo secrets ANDROID_KEYSTORE_BASE64 (+ KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD). When absent, the release bundle falls
      # back to debug signing so the build never fails.
      - name: Decode keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/eyebrowser.keystore
          echo "KEYSTORE_PATH=/tmp/eyebrowser.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (Play upload)
        run: gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-aab
          path: app/build/outputs/bundle/release/app-release.aab
