name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners ship an Android SDK; install the packages this build needs.
      # (Licenses are pre-accepted via license files: `yes | sdkmanager` breaks
      # under the runner's `pipefail` shell option.)
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55d' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d71' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Optional: sign the release bundle with the real upload key.
      # Set repo secrets ANDROID_KEYSTORE_BASE64 (+ KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD). When absent, the step is a no-op and the
      # release bundle falls back to debug signing so the build never fails.
      - name: Decode keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/eyebrowser.keystore
            {
              echo "KEYSTORE_PATH=/tmp/eyebrowser.keystore"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No keystore secret — release will use debug signing."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Build release AAB (Play upload)
        run: gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eyebrowser-aab
          path: app/build/outputs/bundle/release/app-release.aab
